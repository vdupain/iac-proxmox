# prometheus.yml — Exported from LXC 105 (pve0)
#
# Source: /etc/prometheus/prometheus.yml (Prometheus v3.13.1)
# Host: LXC 105, node pve0, Debian amd64, 1 core / 2GB RAM
# Exported via: Prometheus API /api/v1/status/config
# Export date: 2026-08-20
#
# Notes:
#   - Scrape configs are in separate files: /etc/prometheus/scrape_configs/*.yml
#   - Rule files in: /etc/prometheus/rules/*.yml
#   - Storage retention: 15d
#   - web.enable-admin-api: true, web.enable-lifecycle: true
#   - Agent mode: false (full TSDB)
#

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 1m

alerting:
  alertmanagers:
    - follow_redirects: true
      enable_http2: true
      scheme: http
      timeout: 10s
      api_version: v2
      static_configs:
        - targets:
            - prometheus-alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_config_files:
  - /etc/prometheus/scrape_configs/*.yml

storage:
  tsdb:
    outofordertimewindow: 0s
    retention:
      time: 15d