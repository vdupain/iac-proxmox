# grafana.ini — Exported from LXC 107 (pve2)
#
# Source: /etc/grafana/grafana.ini (Grafana v13.1.1)
# Host: LXC 107, node pve2, Debian amd64, 2 cores / 1GB RAM
# Exported via: Grafana API /api/admin/settings (auth: admin/admin)
# Export date: 2026-08-20
#
# Notes:
#   - Default admin password is "admin" (UNCHANGED from default!)
#   - Only 1 datasource configured: "prometheus" -> http://prometheus:9090
#   - Sqlite3 database at /var/lib/grafana/grafana.db
#   - No LDAP, no SMTP configured
#   - Anonymous auth disabled
#   - Unified alerting active (internal, no external alertmanager)
#

[server]
http_addr = 0.0.0.0
http_port = 3000
protocol = http
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/
enable_gzip = true

[database]
type = sqlite3
host = 127.0.0.1:3306
name = grafana
user = root
path = grafana.db
ssl_mode = disable

[security]
admin_user = admin
admin_password = admin
cookie_secure = false

[auth]
disable_login_form = false
disable_signout_menu = false

[auth.basic]
enabled = true

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_language = en-US
default_theme = dark

[log]
level = info
mode = console file

[log.file]
file_name = /var/log/grafana/grafana.log
max_days = 7
max_lines = 1000000

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[unified_alerting]
enabled = true
ha_listen_address = 0.0.0.0:9094
evaluation_timeout = 30s
min_interval = 10s

[metrics]
enabled = true
interval_seconds = 10

[analytics]
check_for_updates = true
check_for_plugin_updates = true
reporting_enabled = true

[feature_toggles]
enable =

[date_formats]
default_timezone = browser
default_week_start = browser